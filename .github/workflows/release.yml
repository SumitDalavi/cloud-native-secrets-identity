name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release Catalog & Policy Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Package Release Distribution Bundle
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz"
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='.terraform' -czf "/tmp/$ARCHIVE_NAME" .
          mv "/tmp/$ARCHIVE_NAME" .
          sha256sum "$ARCHIVE_NAME" > checksums.txt
          echo "Package created: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME" checksums.txt

      - name: Generate Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Push Helm Chart to GHCR OCI
        run: |
          REPO="${{ github.event.repository.name }}"
          VER="${{ github.ref_name }}"
          SEMVER="${VER#v}"

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

          helm package ./helm --version "${SEMVER}" --app-version "${VER}"
          helm push "${REPO}-${SEMVER}.tgz" "oci://ghcr.io/${{ github.repository_owner }}"
          echo "✅ Helm: oci://ghcr.io/${{ github.repository_owner }}/${REPO}:${SEMVER}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.event.repository.name }}-*.tar.gz
            checksums.txt
            sbom.spdx.json
