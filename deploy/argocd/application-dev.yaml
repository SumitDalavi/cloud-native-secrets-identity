apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-secrets-identity-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: security
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SumitDalavi/cloud-native-secrets-identity.git
    targetRevision: master
    path: deploy/k8s/overlays/dev
    kustomize:
      images:
        - name: ghcr.io/sumitdalavi/cloud-native-secrets-identity
          newTag: v0.2.0
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
