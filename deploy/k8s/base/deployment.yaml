apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-secrets-identity
  labels:
    app.kubernetes.io/name: cloud-native-secrets-identity
    app.kubernetes.io/part-of: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-native-secrets-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-native-secrets-identity
        app.kubernetes.io/part-of: security
    spec:
      serviceAccountName: cloud-native-secrets-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/sumitdalavi/cloud-native-secrets-identity:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
